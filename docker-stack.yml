# ============================================================
# AtléticaHub — stack de PRODUÇÃO (Docker Swarm)
# Deploy:  docker stack deploy -c docker-stack.yml atletica
# Antes:   carregue os segredos ->  set -a; source .env.prod; set +a
# Imagens: buildadas no GitHub Actions e publicadas no GHCR (ver .github/workflows).
# ============================================================
version: "3.9"

x-restart: &restart
  restart_policy: { condition: any, delay: 5s }

services:
  # ---------- Proxy + HTTPS (Let's Encrypt) ----------
  traefik:
    image: traefik:v3.1
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=atletica_net
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt
    networks: [atletica_net]
    deploy:
      placement: { constraints: [node.role == manager] }
      <<: *restart

  # ---------- Banco / cache / storage ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atletica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: atletica_hub
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [atletica_net]
    deploy:
      placement: { constraints: [node.role == manager] }
      <<: *restart

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [atletica_net]
    deploy:
      placement: { constraints: [node.role == manager] }
      <<: *restart

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atletica
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes: [minio_data:/data]
    networks: [atletica_net]
    deploy:
      placement: { constraints: [node.role == manager] }
      <<: *restart

  createbuckets:
    image: minio/mc
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 atletica $${MINIO_PASSWORD}) do echo aguardando minio; sleep 2; done;
      /usr/bin/mc mb -p local/atletica-hub || true;
      /usr/bin/mc anonymous set none local/atletica-hub || true;
      exit 0;"
    environment:
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    networks: [atletica_net]
    deploy:
      restart_policy: { condition: none }
      placement: { constraints: [node.role == manager] }

  # ---------- App ----------
  backend:
    image: ${REGISTRY:-nacomberi}/atletica-backend:${TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://atletica:${POSTGRES_PASSWORD}@postgres:5432/atletica_hub
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: atletica
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_BUCKET: atletica-hub
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY}
      DOCUMENT_HASH_PEPPER: ${DOCUMENT_HASH_PEPPER}
      CORS_ORIGIN: https://${DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: https://${DOMAIN}
    networks: [atletica_net]
    deploy:
      replicas: 1
      <<: *restart

  web:
    image: ${REGISTRY:-nacomberi}/atletica-web:${TAG:-latest}
    networks: [atletica_net]
    deploy:
      replicas: 1
      <<: *restart
      labels:
        - traefik.enable=true
        - traefik.http.routers.web.rule=Host(`${DOMAIN}`)
        - traefik.http.routers.web.entrypoints=websecure
        - traefik.http.routers.web.tls.certresolver=le
        - traefik.http.services.web.loadbalancer.server.port=80

networks:
  atletica_net:
    driver: overlay
    attachable: true

volumes:
  pg_data:
  redis_data:
  minio_data:
  traefik_acme:
