name: build-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push — backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/atletica-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/atletica-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push — web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/atletica-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/atletica-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Redeploy automático — dispara o webhook da stack no Portainer (se configurado)
  redeploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Webhook do Portainer
        env:
          HOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "PORTAINER_WEBHOOK não setado — atualize a stack manualmente no Portainer (Pull and redeploy)."; exit 0; fi
          curl -fsSL -X POST "$HOOK" && echo "Redeploy disparado no Portainer."
