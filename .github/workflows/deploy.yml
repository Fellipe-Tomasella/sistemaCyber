name: build-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Owner em minúsculo (GHCR exige minúsculo)
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push — backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/atletica-backend:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/atletica-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push — web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/atletica-web:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/atletica-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy automático na VPS — só roda se você setar os secrets VPS_HOST/VPS_USER/VPS_SSH_KEY
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy no Swarm via SSH
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$HOST" ]; then echo "VPS_HOST não configurado — pulando deploy automático. Faça o deploy manual (ver DEPLOY.md)."; exit 0; fi
          mkdir -p ~/.ssh && printf '%s' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id "$USER@$HOST" \
            'cd /opt/atletica && git pull --ff-only && set -a && . ./.env.prod && set +a && docker stack deploy -c docker-stack.yml atletica --with-registry-auth --resolve-image always'
