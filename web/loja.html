<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ah-head -->
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/brasao-cyber.jpeg">
<meta name="description" content="Camisetas, kits e produtos oficiais da Atlética Cyber. Sócio paga menos em tudo.">
<link rel="canonical" href="https://cyber.hyperdynamis.com/loja">
<meta property="og:type" content="website">
<meta property="og:site_name" content="A.A.A.S.I. Cyber">
<meta property="og:title" content="Loja — A.A.A.S.I. Cyber">
<meta property="og:description" content="Camisetas, kits e produtos oficiais da Atlética Cyber. Sócio paga menos em tudo.">
<meta property="og:url" content="https://cyber.hyperdynamis.com/loja">
<meta property="og:image" content="https://cyber.hyperdynamis.com/assets/brasao-cyber.jpeg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0d13">
<title>Loja — A.A.A.S.I. Cyber</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="/vendor/phosphor/fill/style.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/store.css">
</head>
<body>
<div class="store">
  <div id="siteNav"></div>
  <section class="hero-store" style="padding:34px 32px 28px">
    <div class="hero-store__row">
      <div class="grow stack gap-8">
        <span class="eyebrow" id="count">Loja</span>
        <h1 style="font-size:clamp(34px,4vw,54px)">Loja da Cyber</h1>
        <p style="margin:0;color:#a9bacd;font-size:15px">Merch, kits e produtos da atlética. Sócio paga menos em tudo.</p>
      </div>
    </div>
  </section>
  <section class="section" id="cats"></section>
  <section class="section" style="padding-top:0"><div class="products" id="products"></div></section>
  <footer id="siteFooter"></footer>
</div>
<script src="/js/api.js"></script>
<script src="/js/store.js"></script>
<script>
(async function () {
  const d = await AH.store.init('loja');
  const host = document.getElementById('products');
  if (!d) { host.innerHTML = '<div class="dim" style="grid-column:1/-1">Loja indisponível.</div>'; return; }
  document.getElementById('count').textContent = `${d.products.length} ${d.products.length === 1 ? 'produto' : 'produtos'}`;
  host.innerHTML = d.products.length ? d.products.map(AH.store.productCard).join('') : '<div class="ah-empty" style="grid-column:1/-1"><i class="ph ph-t-shirt"></i><span>Nenhum produto no catálogo ainda.</span></div>';
})();
</script>
</body>
</html>
