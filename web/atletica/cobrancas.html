<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobranças — AtléticaHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="../vendor/phosphor/fill/style.css">
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/main.css">
<style>
  .cob-head,.cob-row{display:grid;grid-template-columns:1fr 130px 120px 130px 140px;gap:14px;align-items:center}
  @media(max-width:720px){.cob-head span:nth-child(2),.cob-row>*:nth-child(2){display:none}.cob-head,.cob-row{grid-template-columns:1fr 110px 120px 120px}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <div class="main">
    <header class="hero">
      <div class="hero__row">
        <div class="stack gap-6"><span class="eyebrow" id="eyebrow">Mensalidades</span><h1>Cobranças</h1></div>
        <button class="btn btn--primary" id="newBtn"><i class="ph ph-plus"></i>Nova cobrança</button>
      </div>
      <div class="row gap-10" style="margin-top:16px" id="chips"></div>
    </header>
    <div class="page-body">
      <div class="panel panel--pad0" style="overflow:hidden">
        <div class="cob-head" style="padding:10px 22px;background:var(--surface-3);border-bottom:1px solid var(--border);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim);font-weight:600">
          <span>Sócio</span><span>Valor</span><span>Vencimento</span><span>Status</span><span style="text-align:right">Ação</span>
        </div>
        <div id="rows"></div>
      </div>
    </div>
  </div>
</div>
<script src="../js/api.js"></script><script src="../js/layout.js"></script>
<script>
const ST={pending:['Pendente','pill--warn'],paid:['Pago','pill--success'],overdue:['Vencida','pill--danger'],cancelled:['Cancelada','pill--neutral']};
let FILTER='';
async function init(){
  AH.renderRail('cobrancas');
  document.getElementById('newBtn').onclick = newCharge;
  await load();
}
async function load(){
  let d; try { d = await AH.api.get('/member-payments'+(FILTER?'?status='+FILTER:'')); } catch(e){ AH.toast(e.message,'err'); return; }
  document.getElementById('eyebrow').textContent = AH.fmtBRL(d.openTotalCents)+' em aberto';
  const chips=[['Todas',''],['Pendentes','pending'],['Vencidas','overdue'],['Pagas','paid']];
  document.getElementById('chips').innerHTML = chips.map(([l,f])=>`<span class="chip ${f===FILTER?'is-active':''}" data-f="${f}">${l}</span>`).join('');
  document.querySelectorAll('#chips .chip').forEach(c=>c.onclick=()=>{FILTER=c.dataset.f;load();});
  const host=document.getElementById('rows');
  if(!d.payments.length){ host.innerHTML='<div class="ah-empty"><i class="ph ph-receipt"></i><span>Nenhuma cobrança.</span></div>'; return; }
  host.innerHTML = d.payments.map(p=>{
    const [lbl,cls]=ST[p.status]||ST.pending;
    return `<div class="cob-row" style="padding:12px 22px;border-bottom:1px solid var(--border-hair);font-size:13px">
      <span class="row gap-10"><span class="avatar">${AH.initials(p.memberName||'?')}</span><span class="ellipsis" style="font-weight:500">${AH.escape(p.memberName||'—')}</span></span>
      <span class="num" style="font-weight:600">${AH.fmtBRL(p.amountCents)}</span>
      <span class="num" style="color:${p.status==='overdue'?'var(--danger-soft)':'var(--text-muted)'}">${AH.fmtDate(p.dueDate)}</span>
      <span><span class="pill ${cls}">${lbl}</span></span>
      <span style="text-align:right">${p.status==='paid'?'<span class="dim" style="font-size:12px">✓ '+AH.fmtDate(p.paidAt)+'</span>':`<button class="btn btn--success" style="font-size:12px;padding:7px 12px" onclick="pay('${p.id}')">Marcar pago</button>`}</span>
    </div>`;
  }).join('');
}
async function pay(id){ try{ await AH.api.post('/member-payments/'+id+'/pay',{}); AH.toast('Pagamento confirmado ✅'); load(); }catch(e){ AH.toast(e.message,'err'); } }
async function newCharge(){
  let members; try{ members=(await AH.api.get('/members')).members; }catch(e){ AH.toast(e.message,'err'); return; }
  AH.formModal({
    title:'Nova cobrança',
    fields:[
      {name:'memberId',label:'Sócio',type:'select',required:true,options:members.map(m=>({value:m.id,label:m.name}))},
      {name:'amountCents',label:'Valor (R$)',type:'money',required:true},
      {name:'dueDate',label:'Vencimento',value:new Date().toISOString().slice(0,10),required:true,hint:'formato aaaa-mm-dd'},
    ],
    onSubmit: async(v)=>{ await AH.api.post('/member-payments',{memberId:v.memberId,amountCents:v.amountCents,dueDate:v.dueDate}); AH.toast('Cobrança criada'); load(); }
  });
}
window.pay=pay;
if(AH.guard('director') && AH.guardModule('cobrancas')) init();
</script>
</body>
</html>
