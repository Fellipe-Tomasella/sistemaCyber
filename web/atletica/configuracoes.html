<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configurações — AtléticaHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="../vendor/phosphor/fill/style.css">
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/main.css">
</head>
<body>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <div class="main">
    <header class="hero"><div class="hero__row"><div class="stack gap-6"><span class="eyebrow">Ajustes da atlética</span><h1>Configurações</h1></div></div></header>
    <div class="page-body" style="max-width:620px">
      <div class="panel" style="display:flex;flex-direction:column;gap:16px">
        <strong class="panel__title--display">Dados da atlética</strong>
        <div class="ah-field"><label>Nome</label><input id="f-name"></div>
        <div class="ah-field"><label>Faculdade</label><input id="f-uni"></div>
        <div class="ah-field"><label>Semestre atual</label><input id="f-sem" placeholder="2026.2"></div>
        <button class="btn btn--primary" id="saveBtn" style="align-self:flex-start"><i class="ph ph-check"></i>Salvar</button>
      </div>
      <a class="panel" href="pagamentos" style="display:flex;align-items:center;gap:14px;color:var(--text);text-decoration:none">
        <i class="ph ph-credit-card" style="font-size:26px;color:var(--brand-accent)"></i>
        <div class="grow stack" style="line-height:1.3"><strong style="font-size:14.5px">Pagamentos</strong><span class="dim" style="font-size:12.5px">Configurar Pix e cartão (Mercado Pago), taxas e repasse</span></div>
        <i class="ph ph-arrow-right" style="color:var(--text-dim)"></i>
      </a>
      <a class="panel" href="site" style="display:flex;align-items:center;gap:14px;color:var(--text);text-decoration:none">
        <i class="ph ph-layout" style="font-size:26px;color:var(--brand-accent)"></i>
        <div class="grow stack" style="line-height:1.3"><strong style="font-size:14.5px">Página inicial do site</strong><span class="dim" style="font-size:12.5px">Banner, carrosséis (parceiros, diretoria), galeria e contato</span></div>
        <i class="ph ph-arrow-right" style="color:var(--text-dim)"></i>
      </a>
      <div class="panel" style="border-color:rgba(239,68,68,0.3);display:flex;flex-direction:column;gap:10px">
        <strong style="font-size:13px;color:var(--danger-soft)">Zona de perigo</strong>
        <span class="dim" style="font-size:12.5px">Encerrar a gestão ou excluir a atlética são ações irreversíveis.</span>
        <button class="btn btn--danger" style="align-self:flex-start;font-size:12px;padding:7px 12px" onclick="AH.toast('Ação sensível — confirmação em breve','warn')">Excluir atlética</button>
      </div>
    </div>
  </div>
</div>
<script src="../js/api.js"></script><script src="../js/layout.js"></script>
<script>
let WS;
async function init(){
  AH.renderRail('config');
  try{ WS=(await AH.api.get('/workspace')).workspace; }catch(e){ AH.toast(e.message,'err'); return; }
  document.getElementById('f-name').value=WS.name||'';
  document.getElementById('f-uni').value=WS.university||'';
  document.getElementById('f-sem').value=WS.currentSemester||'';
  document.getElementById('saveBtn').onclick=save;
}
async function save(){
  const btn=document.getElementById('saveBtn'); btn.disabled=true;
  try{ await AH.api.patch('/workspace',{name:document.getElementById('f-name').value,university:document.getElementById('f-uni').value,currentSemester:document.getElementById('f-sem').value}); AH.toast('Salvo ✅'); }
  catch(e){ AH.toast(e.message,'err'); }
  btn.disabled=false;
}
if(AH.guard('director') && AH.guardAdmin()) init();
</script>
</body>
</html>
