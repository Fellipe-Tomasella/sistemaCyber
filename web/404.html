<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — AtléticaHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css">
<style>
  body { min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--hero-radial); position:relative; overflow:hidden; }
  body::before { content:""; position:fixed; inset:0; background:repeating-linear-gradient(115deg, rgba(0,191,255,0.06) 0 2px, transparent 2px 40px); pointer-events:none; }
  .box { position:relative; text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; max-width:520px; }
  .code { font-family:var(--font-display); font-size:clamp(90px,18vw,160px); line-height:0.9; letter-spacing:0.02em; color:var(--brand-accent); text-shadow:0 0 60px rgba(0,191,255,0.4); }
  .box img { height:120px; width:auto; mix-blend-mode:lighten; filter:drop-shadow(0 0 40px rgba(0,191,255,0.35)); }
  h1 { font-family:var(--font-display); font-weight:400; font-size:30px; letter-spacing:0.02em; text-transform:uppercase; margin:0; }
  .btn--hero { font-family:var(--font-ui); font-weight:700; font-size:15px; text-transform:none; padding:13px 22px; }
</style>
</head>
<body>
<div class="box">
  <img src="/assets/brasao-cyber.jpeg" alt="">
  <div class="code">404</div>
  <h1>Essa página saiu pra beber</h1>
  <p style="margin:0;color:var(--text-soft);font-size:15px">A gente não encontrou o que você procurava. Que tal voltar pro início e dar uma olhada na loja?</p>
  <div class="row gap-12" style="flex-wrap:wrap;justify-content:center">
    <a class="btn btn--primary btn--hero" href="/loja/"><i class="ph ph-house"></i> Voltar ao início</a>
    <a class="btn btn--hero" href="/atletica/login" style="border-color:#2a5c8a"><i class="ph ph-lock-simple"></i> Painel da diretoria</a>
  </div>
</div>
</body>
</html>
