server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API na mesma origem → backend (Swarm resolve "backend" pela rede overlay)
  location ^~ /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;   # uploads (limite do backend é 5MB)
  }

  # JS/CSS sempre frescos (sem cache-busting ainda)
  location ~* \.(js|css)$ { add_header Cache-Control "no-store" always; }

  # URLs limpas: /atletica/dashboard -> dashboard.html ; /loja -> loja.html
  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
